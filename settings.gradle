pluginManagement {
    repositories {
        // Local-only accelerating mirror (parallel-range prefetch cache).
        // Enabled on the dev box only: marker file exists there, CI runners skip it.
        if (file('/home/ecs-user/tools/maven_mirror.py').exists()) {
            maven {
                url = uri("http://127.0.0.1:8090")
                allowInsecureProtocol = true
            }
        }
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'easytier-mc'
